<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node</title>
  <meta
    name="description"
    content="Node is a collaborative interface design tool. Create UI assets, prototype together in real time, and hand off production-ready assets to developers."

    // Node ships dark-first: apply before paint to avoid a flash.
    try {
      document.documentElement.classList.add("dark");
    } catch (e) {
      /* noop */
    }
  </script>
</head>

  <script type="module" src="/src/main.tsx"></script>
</body>
